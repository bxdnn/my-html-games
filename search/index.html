
<form id="searchForm">
  <input id="query" placeholder="Search websites..." required>
  <button type="submit">Search</button>
</form>

<div id="results"></div>

<script>
const websites = [
  { name: "Google", url: "https://www.google.com/" },
  { name: "YouTube", url: "https://www.youtube.com/" },
  { name: "Wikipedia", url: "https://www.wikipedia.org/" },
  { name: "GitHub", url: "https://github.com/" },
  { name: "Coolmath Games", url: "https://www.coolmathgames.com/" }
];

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();

  const q = document.getElementById("query").value.toLowerCase();
  const results = websites.filter(site =>
    site.name.toLowerCase().includes(q)
  );

  document.getElementById("results").innerHTML = "";

  if (!results.length) {
    document.getElementById("results").textContent =
      "No matching websites found. Try Google, YouTube, or Wikipedia.";
    return;
  }

  results.forEach(site => {
    const link = document.createElement("a");
    link.href = site.url;
    link.textContent = site.name;
    link.style.display = "block";
    link.style.padding = "12px";
    link.style.color = "#a78bfa";
    document.getElementById("results").appendChild(link);
  });
});
</script>
